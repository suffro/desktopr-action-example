# Temporary: checks the AppImage fix on a first attempt, from a repository
# that is not the one the action lives in.

name: debug

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  first-attempt:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: suffro/desktopr@fix-appimage
        id: build
        with:
          app_name: Fix Check
          app_identifier: dev.desktopr.fixcheck
          app_version: 1.0.0
          app_url: https://desktopr.dev
          smoke_test: false
          upload_artifact: false

      - name: The AppImage must exist on the first try
        run: |
          set -euo pipefail
          ls -la "${{ steps.build.outputs.dist_dir }}"
          test -n "$(find "${{ steps.build.outputs.dist_dir }}" -name '*.AppImage' -print -quit)" \
            || { echo "::error::still no AppImage"; exit 1; }
          echo "OK: AppImage produced on the first attempt"
